<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify Phone</title>
<style>body{background:#0f172a;color:#fff;font-family:sans-serif;padding:20px}input{width:100%;padding:14px;margin:8px 0;border-radius:10px;border:0}button{width:100%;padding:14px;background:#f59e0b;border:0;border-radius:10px;font-weight:700}</style></head>
<body><h2>Verify Phone - Unlock Wallet</h2><p>Needed for Wallet, Rated Games & Tournaments</p>
<input id="ph" placeholder="Phone e.g 0977xxxxxx">
<button onclick="send()">Send SMS Code</button>
<div id="step2" style="display:none"><input id="c" placeholder="SMS Code"><button onclick="v()">Verify Phone</button></div><p id="msg"></p>
<script>
function send(){
  const ph=document.getElementById('ph').value;
  if(ph.length<10){document.getElementById('msg').innerText='Enter valid Zambian number';return;}
  const code=Math.floor(100000+Math.random()*900000).toString();
  const p=JSON.parse(localStorage.getItem('zg_user')||'{}'); p.phone=ph; p.phoneCode=code;
  localStorage.setItem('zg_user', JSON.stringify(p)); localStorage.setItem('zg_pending', JSON.stringify(p));
  alert('SMS code (Demo): '+code); document.getElementById('step2').style.display='block';
}
function v(){
  const p=JSON.parse(localStorage.getItem('zg_user')||'{}');
  if(document.getElementById('c').value===p.phoneCode){
    p.phoneVerified=true; localStorage.setItem('zg_user', JSON.stringify(p));
    localStorage.setItem('zg_phone_verified','yes');
    alert('Phone verified! Wallet + Tournaments unlocked'); location.href='/';
  } else document.getElementById('msg').innerText='Wrong code';
}
</script></body></html>
