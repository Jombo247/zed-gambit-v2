name = "zed-gambit"
main = "worker.mjs"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
run_worker_first = true

[[durable_objects.bindings]]
name = "CHESS_ROOM"
class_name = "ChessRoom"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[migrations]]
new_sqlite_classes = ["ChessRoom", "Lobby"]
tag = "v3"